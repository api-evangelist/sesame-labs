name: Sesame Labs
description: >-
  Sesame Labs is the San Francisco company behind Notch (usenotch.ai), an
  AI-powered advertising platform that generates finished, ready-to-run video
  and image ads from a plain-language brief — script, AI avatar, voiceover,
  b-roll footage, captions, and the full edit — rather than isolated clips.
  Notch is distributed to agents primarily as a hosted, remote Model Context
  Protocol (MCP) connector at app.usenotch.ai/mcp: any MCP-capable client
  (Claude, Claude Code, ChatGPT) connects over streamable HTTP with browser-based
  OAuth 2.0 sign-in and no API keys, then briefs Notch like a teammate to produce
  ads that land in the user's workspace. Sesame Labs is a portfolio company of
  Wing Venture Capital.
