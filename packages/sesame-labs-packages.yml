notes: >-
  Notch ships no client libraries. Access is exclusively through the hosted, remote
  MCP connector at https://app.usenotch.ai/mcp — there is no API key, no REST API,
  and therefore nothing for an SDK to wrap. The setup guide and llms.txt document
  only connector URLs and client-side install commands (`claude mcp add`,
  `codex mcp add`), which install nothing of Notch's own: they register the remote
  URL in the MCP client. No stdio/npx package is published either. Recorded as an
  honest zero; no SDKs pointer is wired in apis.yml because there is no SDK.
