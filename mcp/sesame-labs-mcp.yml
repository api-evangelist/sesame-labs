server:
  name: notch
  title: Notch
  version: 1.0.1
  transport: streamable-http
  url: https://app.usenotch.ai/mcp
  description: Notch turns a product page and plain-language brief into a finished video or image ad.
    Connect it over MCP to create, review, and edit ads from your AI chat. Ads created over MCP land in
    the user's Notch workspace and spend the same monthly credits as ads created on the web.
authentication:
  type: oauth2
  description: Browser-based OAuth 2.0 sign-in; no API keys to create or paste. Public client with PKCE
    (S256) and RFC 7591 dynamic client registration.
  resource_metadata: https://app.usenotch.ai/.well-known/oauth-protected-resource/mcp
  authorization_server: https://app.usenotch.ai/.well-known/oauth-authorization-server
  challenge: 'WWW-Authenticate: Bearer resource_metadata="https://app.usenotch.ai/.well-known/oauth-protected-resource/mcp"'
install:
  claude_connector: https://claude.ai/customize/connectors?modal=add-custom-connector&connectorName=Notch&connectorUrl=https%3A%2F%2Fapp.usenotch.ai%2Fmcp
  claude_manual: Customize -> Connectors -> Add custom connector -> paste https://app.usenotch.ai/mcp
  claude_cli: claude mcp add --transport http notch https://app.usenotch.ai/mcp
  codex_cli: codex mcp add notch --url https://app.usenotch.ai/mcp   # then `codex mcp login notch`
  chatgpt: Settings -> Plugins -> Developer mode on, then Plugins page -> + -> Server URL https://app.usenotch.ai/mcp
    with Authentication set to OAuth
capabilities:
- Turn a product page URL plus a plain-language brief into a finished video ad (script, avatar, voiceover,
  footage, captions, edit)
- Generate static and animated image ads (e.g. three 4:5 concepts from one benefit)
- Produce UGC-style videos, product demos and cinematic shorts
- Return hooks, script, avatar, first frames and scene clips into the chat for approval before rendering
- Create variants of an existing best-performing ad
- Save every finished ad to the user's Notch workspace and return the download link in chat
