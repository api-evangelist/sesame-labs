server:
  name: notch
  title: Notch
  version: 1.0.0
  transport: streamable-http
  url: https://app.usenotch.ai/mcp
  description: >-
    Notch creates finished video and image ads from a plain-language brief.
    Connect it to an AI assistant over MCP and brief it like a teammate —
    avatars, voiceover, footage, captions, the full edit. Ads created over MCP
    land in the user's Notch workspace and spend the same monthly credits as ads
    created on the web.
authentication:
  type: oauth2
  description: >-
    Browser-based OAuth 2.0 sign-in; no API keys to create or paste. Public
    client with PKCE (S256) and RFC 7591 dynamic client registration.
  resource_metadata: https://app.usenotch.ai/.well-known/oauth-protected-resource/mcp
  authorization_server: https://app.usenotch.ai/.well-known/oauth-authorization-server
install:
  claude_cli: claude mcp add --transport http notch https://app.usenotch.ai/mcp
  claude_connector: https://claude.ai/customize/connectors?modal=add-custom-connector&connectorName=Notch&connectorUrl=https%3A%2F%2Fapp.usenotch.ai%2Fmcp
  chatgpt: Settings -> Connectors -> Advanced -> Developer mode -> Create -> paste the URL
# The server card and docs describe capabilities but do not enumerate tool names,
# and the tools/list requires an authenticated OAuth session, so exact tool
# names/operationIds are not captured here (no fabrication).
capabilities:
- Generate a finished video ad from a plain-language brief (script, avatar, voiceover, footage, captions, edit)
- Generate static image ads
- Select and customize AI avatars
- Review and approve storyboards
- Produce UGC-style videos and product demos
tools_note: >-
